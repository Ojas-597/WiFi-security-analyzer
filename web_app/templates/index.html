<!DOCTYPE html>
<html lang="en">
<head>
    <title>Wi-Fi Security Analyzer</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #0f172a;
            color: white;
        }

        .card {
            border-radius: 15px;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .output-box {
            background: #111827;
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
            height: 200px;
            overflow-y: auto;
        }

        .navbar {
            background: #020617;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark">
    <div class="container">
        <span class="navbar-brand mb-0 h1">
            🔐 Wi-Fi Security Analyzer
        </span>
    </div>
</nav>

<div class="container mt-5">

    <!-- ACTION CARDS -->
    <div class="row g-4">

        <div class="col-md-4">
            <a href="/scan" class="text-decoration-none">
                <div class="card bg-success text-white p-4 text-center">
                    <i class="bi bi-wifi fs-1"></i>
                    <h5 class="mt-2">Scan Networks</h5>
                </div>
            </a>
        </div>

        <div class="col-md-4">
            <a href="/analyze" class="text-decoration-none">
                <div class="card bg-primary text-white p-4 text-center">
                    <i class="bi bi-shield-check fs-1"></i>
                    <h5 class="mt-2">Analyze Security</h5>
                </div>
            </a>
        </div>

        <div class="col-md-4">
            <a href="/simulate" class="text-decoration-none">
                <div class="card bg-warning text-dark p-4 text-center">
                    <i class="bi bi-exclamation-triangle fs-1"></i>
                    <h5 class="mt-2">Simulate Attack</h5>
                </div>
            </a>
        </div>

        <div class="col-md-4">
            <a href="/graph" class="text-decoration-none">
                <div class="card bg-info text-dark p-4 text-center">
                    <i class="bi bi-bar-chart fs-1"></i>
                    <h5 class="mt-2">View Graph</h5>
                </div>
            </a>
        </div>

        <div class="col-md-4">
            <a href="/ml" class="text-decoration-none">
                <div class="card bg-secondary text-white p-4 text-center">
                    <i class="bi bi-cpu fs-1"></i>
                    <h5 class="mt-2">ML Detection</h5>
                </div>
            </a>
        </div>

        <div class="col-md-4">
            <a href="/report" class="text-decoration-none">
                <div class="card bg-danger text-white p-4 text-center">
                    <i class="bi bi-file-earmark-text fs-1"></i>
                    <h5 class="mt-2">Generate Report</h5>
                </div>
            </a>
        </div>

    </div>

    <!-- OUTPUT PANEL -->
    <div class="output-box mt-5">
        <h5>📊 System Output</h5>
        <hr style="border-color: gray;">
        <p>{{ data|safe }}</p>
    </div>

</div>

</body>
</html>
